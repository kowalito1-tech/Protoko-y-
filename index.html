<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protokoły Hydro-Vacuum</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#004B87">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protokoły">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23004B87'/%3E%3Ccircle cx='90' cy='90' r='70' fill='none' stroke='%23009FE3' stroke-width='7'/%3E%3Cpath d='M52 34h56l20 20v92H52z' fill='%23ffffff'/%3E%3Crect x='64' y='64' width='52' height='6' fill='%23004B87'/%3E%3Crect x='64' y='83' width='52' height='6' fill='%23004B87'/%3E%3Crect x='64' y='102' width='52' height='6' fill='%23004B87'/%3E%3Crect x='64' y='121' width='52' height='6' fill='%23004B87'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5b6b79;--line:#cdd5dc;--acc:#004B87;--acc2:#009FE3;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--panel:#1a242d;--ink:#e6edf2;--mute:#93a3b0;--line:#33424e;--acc:#009FE3;--acc2:#5db3e8;--accink:#07202f}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.32 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:860px;margin:0 auto;padding:10px 12px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-logo{width:36px;height:36px;border-radius:8px;flex-shrink:0;box-shadow:0 2px 5px rgba(0,75,135,.2)}
.brand-txt h1{font-size:1.05rem;margin:0;line-height:1.15}
.brand-txt span{display:block;font-size:.72rem;font-weight:700;color:var(--acc);letter-spacing:.2px}
.lock-btn{min-height:32px;padding:4px 10px;font-size:.76rem;display:inline-flex;align-items:center;gap:4px;border-radius:7px;color:var(--mute)}
.lock-btn:hover{color:var(--ink);border-color:var(--acc)}

/* Ekran blokady PIN */
#pinGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#003766 0%,#004B87 55%,#0068b5 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:16px}
#pinGate.hidden{display:none!important}
.pin-card{width:100%;max-width:320px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:20px 16px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.pin-card svg{width:54px;height:54px;border-radius:13px;margin:0 auto 10px;display:block;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.pin-card h2{margin:0;font-size:1.1rem;color:#fff}
.pin-card p{margin:4px 0 12px;font-size:.82rem;color:rgba(255,255,255,.82)}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:10px 0 8px}
.pin-dots span{width:13px;height:13px;border-radius:50%;border:2px solid #009FE3;background:transparent;transition:all .15s}
.pin-dots span.on{background:#fff;border-color:#fff;transform:scale(1.12)}
.pin-dots.err span{border-color:#ff6b6b;background:#ff6b6b}
#pinInput{position:absolute;opacity:0;pointer-events:none}
.pin-err{min-height:18px;font-size:.78rem;color:#ffd1d1;font-weight:600;margin-bottom:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pad button{min-height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;font-size:1.18rem;font-weight:700;cursor:pointer;transition:background .12s,transform .08s}
.pad button:active{background:rgba(255,255,255,.28);transform:scale(.97)}
.pad button.fn-key{font-size:.86rem;font-weight:600;background:rgba(0,0,0,.18)}
.pin-rem{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:.8rem;color:rgba(255,255,255,.9);cursor:pointer}
.pin-rem input{width:auto;min-height:auto;accent-color:#009FE3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .26s ease-in-out}

/* Kompaktowe sekcje i pola formularza */
fieldset{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:7px 10px 9px;border-top:2.5px solid var(--acc)}
legend{font-weight:700;font-size:.82rem;padding:0 5px;color:var(--acc)}
label{display:block;font-size:.76rem;color:var(--mute);margin:5px 0 2px}
input,textarea{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input{min-height:34px;height:34px}
textarea{min-height:56px;resize:vertical;line-height:1.3}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.date-row{display:flex;gap:4px;align-items:stretch}
.date-row input{flex:1;min-width:0}
.btn-today{min-height:34px;height:34px;padding:0 8px;font-size:.75rem;font-weight:600;border-radius:6px;border:1px solid var(--acc);color:var(--acc);background:transparent;white-space:nowrap;flex-shrink:0}
.btn-today:hover{background:var(--acc);color:var(--accink)}

/* Zapamiętywanie i lista podpowiedzi */
.hist-wrap{position:relative}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:5px 0 2px}
.lbl-row label{margin:0}
.hist-btn{min-height:20px;height:20px;padding:0 6px;font-size:.7rem;font-weight:600;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--acc);display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.hist-btn:hover{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.hist-btn .cnt{opacity:.75;font-weight:400}
.hist-pop{position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:120;background:var(--panel);border:1.5px solid var(--acc);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.18);overflow:hidden;display:none}
.hist-pop.open{display:block}
.hist-head{display:flex;align-items:center;gap:5px;padding:5px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.hist-head input{min-height:28px;height:28px;padding:3px 7px;font-size:.8rem;background:var(--panel)}
.hist-clr{min-height:28px;height:28px;padding:0 7px;font-size:.72rem;color:#c0392b;border-color:transparent;background:transparent;white-space:nowrap}
.hist-clr:hover{background:rgba(192,57,43,.1)}
.hist-list{max-height:180px;overflow-y:auto}
.hist-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.82rem}
.hist-item:last-child{border-bottom:0}
.hist-item:hover{background:var(--bg)}
.hist-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-sub{display:block;font-size:.72rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-del{min-height:22px;height:22px;min-width:22px;padding:0 4px;border-radius:5px;border:0;background:transparent;color:var(--mute);font-size:.8rem}
.hist-del:hover{background:rgba(192,57,43,.14);color:#c0392b}
.hist-empty{padding:9px;text-align:center;font-size:.78rem;color:var(--mute)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.radios{display:flex;flex-wrap:wrap;gap:4px 12px}
.radios label{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:.84rem;margin:2px 0}
.radios input{width:auto;min-height:auto;height:auto}
.bar{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
button{font:inherit;font-size:.84rem;font-weight:600;border-radius:8px;min-height:36px;padding:6px 13px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
h2{font-size:.9rem;margin:12px 0 6px;color:var(--mute)}
#wrap{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff}
#sheet{width:794px;min-height:1123px;padding:44px 50px;background:#fff;color:#111;font:13px/1.35 "Times New Roman",Times,serif;transform-origin:top left}
#sheet .hd{font-weight:700;font-size:13px}
#sheet .t{text-align:center;margin-top:8px}
#sheet .t .n{font-size:17px;font-weight:700}
#sheet .t .s{font-size:13px;font-weight:700;margin-top:6px}
.s1{text-decoration:line-through;color:#777}
.box{border:1.5px solid #111;margin-top:12px}
.box h3{margin:0;text-align:center;font-size:14px;padding:5px;border-bottom:1.5px solid #111}
.sec{padding:6px 10px;border-bottom:1px solid #111}
.sec:last-child{border-bottom:0}
.ln{display:flex;gap:6px;align-items:flex-end;margin:5px 0}
.ln b{white-space:nowrap}
.v{flex:1;min-height:17px;border-bottom:1px dotted #111;color:#12348a;font:15px "Segoe Script","Bradley Hand","Comic Sans MS",cursive;line-height:1.2;padding-left:4px}
.ind{padding-left:20px}
.ruled{color:#12348a;font:15px/24px "Segoe Script","Bradley Hand","Comic Sans MS",cursive;min-height:120px;white-space:pre-wrap;background:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,#111 23px,#111 24px);background-size:100% 24px;margin-top:4px}
.note{font-size:9.5px;line-height:1.25;margin-top:6px}
.sig{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #111;margin:0 -10px -6px}
.sig div{height:105px;padding:6px 10px;border-right:1px solid #111;font-weight:700;position:relative}
.sig div:last-child{border-right:0}
.sig small{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-weight:400;font-size:9.5px}
.sig2{display:flex;justify-content:space-between}
.sig2 .l{flex:1}
.sig2 .r{width:240px;font-weight:700}
.fn{font-size:9.5px;margin-top:4px}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
@media (min-width:960px){
 .app{max-width:1460px;display:grid;grid-template-columns:minmax(330px,400px) 1fr;column-gap:16px;align-items:start}
 .app>*:not(#prev){grid-column:1}
 #prev{grid-column:2;grid-row:1/span 9;position:sticky;top:calc(10px + env(safe-area-inset-top,0px))}
}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 #pinGate{display:none!important}
 .app{display:block!important;max-width:none;padding:0}
 #prev{position:static!important}
 .app>*:not(#prev){display:none!important}
 #prev>h2{display:none}
 #wrap{border:0;height:auto!important}
 #sheet{transform:none!important;margin:0;width:210mm;min-height:297mm;padding:12mm 14mm}
}

#sheet{padding:0!important;min-height:0!important;background:transparent!important;display:block}
.pg{width:794px;height:1123px;padding:44px 50px;background:#fff;color:#111;overflow:hidden;margin-bottom:14px;box-shadow:0 0 0 1px #ccc}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.th{position:relative}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;display:block;border:1px solid var(--line)}
.th button{position:absolute;top:3px;right:3px;min-height:24px;height:24px;padding:0 7px;border-radius:12px;font-size:.72rem}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ph div{height:430px;border:1px solid #111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{max-width:100%;max-height:100%;object-fit:contain}
.hdr{display:flex;justify-content:space-between;align-items:flex-start}
.fc{font-size:12px}
.sig3{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #111;margin:0 -10px -6px}
.sig3>div{padding:6px 10px;border-right:1px solid #111;display:flex;flex-direction:column}
.sig3>div:last-child{border-right:0}
.sig3 small{text-align:center;font-size:9.5px;margin-top:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:36px;margin:0;padding:4px;border:1px solid var(--line);border-radius:7px;color:var(--ink);font-size:.82rem;font-weight:600;cursor:pointer}
.tabs input{position:absolute;opacity:0;width:0;height:0}
.tabs label:has(input:checked){background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tabs label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
@media print{
 #sheet{width:210mm!important;padding:0!important}
 .pg{width:210mm;height:297mm;padding:12mm 14mm;margin:0;box-shadow:none;break-after:page;page-break-after:always}
 .pg:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div id="pinGate" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
 <div class="pin-card" id="pinCard">
  <svg viewBox="0 0 180 180" aria-hidden="true">
   <rect width="180" height="180" fill="#004B87"/>
   <circle cx="90" cy="90" r="70" fill="none" stroke="#009FE3" stroke-width="7"/>
   <path d="M52 34h56l20 20v92H52z" fill="#ffffff"/>
   <rect x="64" y="64" width="52" height="6" fill="#004B87"/>
   <rect x="64" y="83" width="52" height="6" fill="#004B87"/>
   <rect x="64" y="102" width="52" height="6" fill="#004B87"/>
   <rect x="64" y="121" width="52" height="6" fill="#004B87"/>
  </svg>
  <h2 id="pinTitle">Protokoły Hydro-Vacuum</h2>
  <p>Wprowadź kod PIN, aby uzyskać dostęp</p>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Kod PIN">
  <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
  <div class="pin-err" id="pinErr"></div>
  <div class="pad" id="pinPad">
   <button type="button" data-k="1">1</button>
   <button type="button" data-k="2">2</button>
   <button type="button" data-k="3">3</button>
   <button type="button" data-k="4">4</button>
   <button type="button" data-k="5">5</button>
   <button type="button" data-k="6">6</button>
   <button type="button" data-k="7">7</button>
   <button type="button" data-k="8">8</button>
   <button type="button" data-k="9">9</button>
   <button type="button" class="fn-key" data-k="clr">Wyczyść</button>
   <button type="button" data-k="0">0</button>
   <button type="button" class="fn-key" data-k="del">⌫</button>
  </div>
  <label class="pin-rem"><input type="checkbox" id="pinRemember" checked> Zapamiętaj to urządzenie</label>
 </div>
</div>

<div class="app">
<div class="top-bar">
 <div class="brand">
  <svg class="brand-logo" viewBox="0 0 180 180" aria-hidden="true">
   <rect width="180" height="180" fill="#004B87"/>
   <circle cx="90" cy="90" r="70" fill="none" stroke="#009FE3" stroke-width="7"/>
   <path d="M52 34h56l20 20v92H52z" fill="#ffffff"/>
   <rect x="64" y="64" width="52" height="6" fill="#004B87"/>
   <rect x="64" y="83" width="52" height="6" fill="#004B87"/>
   <rect x="64" y="102" width="52" height="6" fill="#004B87"/>
   <rect x="64" y="121" width="52" height="6" fill="#004B87"/>
  </svg>
  <div class="brand-txt">
   <span>HYDRO-VACUUM S.A.</span>
   <h1>Generator protokołów serwisowych</h1>
  </div>
 </div>
 <button type="button" class="lock-btn" id="lockBtn" title="Zablokuj dostęp kodem PIN">🔒 Zablokuj</button>
</div>

<fieldset><legend>Rodzaj protokołu</legend>
 <div class="tabs">
  <label><input type="radio" name="typ" value="s" checked>Usterki / naprawa</label>
  <label><input type="radio" name="typ" value="u">Uruchomienie</label>
  <label><input type="radio" name="typ" value="m">Montaż</label>
 </div>
</fieldset>

<fieldset><legend>Numer i data</legend>
 <div class="g2">
  <div><label for="nr">Numer protokołu (auto)</label><input id="nr" readonly></div>
  <div>
   <label for="data">Data sporządzenia</label>
   <div class="date-row">
    <input id="data" type="date">
    <button type="button" class="btn-today" data-today="data" title="Ustaw dzisiejszą datę">Dziś</button>
   </div>
  </div>
  <div><label for="cnt">Kolejny numer</label><input id="cnt" type="number" min="1" value="1"></div>
  <div><label for="sym">Symbol (inicjały)</label><input id="sym" value="KW"></div>
 </div>
</fieldset>

<fieldset><legend>Dane wyrobu</legend>
 <label for="wyrob">Nazwa wyrobu</label><input id="wyrob" placeholder="np. PSD 2 E/L0">
 <div class="g2">
  <div><label for="nrz">Nr fabryczny zestawu</label><input id="nrz"></div>
  <div><label for="nrs">Nr seryjny sterowania</label><input id="nrs"></div>
 </div>
</fieldset>

<fieldset><legend>Strony</legend>
 <div class="g2">
  <div><label for="nabN">Nabywca – nazwa</label><input id="nabN"></div>
  <div><label for="nabA">Nabywca – adres</label><input id="nabA"></div>
  <div><label for="uzN">Użytkownik – nazwa</label><input id="uzN"></div>
  <div><label for="uzA">Użytkownik – adres (i NIP)</label><input id="uzA"></div>
  <div><label for="invN">Inwestor – nazwa</label><input id="invN"></div>
  <div><label for="invA">Inwestor – adres</label><input id="invA"></div>
 </div>
</fieldset>

<fieldset><legend>Szczegóły</legend>
 <div class="g2">
  <div>
   <label for="dU" id="lbDU">Data</label>
   <div class="date-row">
    <input id="dU" type="date">
    <button type="button" class="btn-today" data-today="dU" title="Ustaw dzisiejszą datę">Dziś</button>
   </div>
  </div>
  <div data-t="s">
   <label for="dE">Data rozpoczęcia eksploatacji</label>
   <div class="date-row">
    <input id="dE" type="date">
    <button type="button" class="btn-today" data-today="dE" title="Ustaw dzisiejszą datę">Dziś</button>
   </div>
  </div>
 </div>
 <div data-t="s">
  <label>Rodzaj (pozostałe zostaną skreślone)</label>
  <div class="radios">
   <label><input type="radio" name="rodzaj" value="0" checked>usuwanie usterek</label>
   <label><input type="radio" name="rodzaj" value="1">naprawa gwarancyjna</label>
   <label><input type="radio" name="rodzaj" value="2">wykonane zlecenie</label>
  </div>
  <label for="usterki">Wykaz stwierdzonych/zgłoszonych usterek</label><textarea id="usterki"></textarea>
  <label for="sposob">Sposób usunięcia usterek</label><textarea id="sposob"></textarea>
 </div>
 <div data-t="um">
  <label>Zgodność danych ze stanem faktycznym?</label>
  <div class="radios">
   <label><input type="radio" name="tak" value="TAK" checked>TAK</label>
   <label><input type="radio" name="tak" value="NIE">NIE</label>
  </div>
  <label for="uwagi">Uwagi do pkt. 5</label><textarea id="uwagi"></textarea>
  <label for="miejsce">Miejsce instalacji</label><input id="miejsce">
  <label for="opis" id="lbOpis">Opis</label><textarea id="opis"></textarea>
  <label for="zal">Zalecenia</label><textarea id="zal"></textarea>
 </div>
</fieldset>

<fieldset><legend>Zdjęcia (załącznik)</legend>
 <div class="bar" style="margin:0 0 6px">
  <button type="button" id="camBtn">Zrób zdjęcie</button>
  <button type="button" id="galBtn">Wybierz z galerii</button>
 </div>
 <input id="cam" type="file" accept="image/*" capture="environment" hidden>
 <input id="gal" type="file" accept="image/*" multiple hidden>
 <div id="thumbs" class="thumbs"></div>
</fieldset>

<fieldset><legend>Egzemplarze i podpisy</legend>
 <div class="g3">
  <div><label for="eN">Egz. Nabywca</label><input id="eN" type="number" min="0" value="1"></div>
  <div><label for="eU">Egz. Użytkownik</label><input id="eU" type="number" min="0" value="1"></div>
  <div><label for="eI">Egz. Inwestor</label><input id="eI" type="number" min="0" value="0"></div>
 </div>
 <div class="g2">
  <div><label for="sA">Protokół sporządził (a)</label><input id="sA"></div>
  <div><label for="sB">Protokół sporządził (b)</label><input id="sB"></div>
 </div>

<script>
(function(){
var CORRECT_PIN="1997";
var PIN_KEY="hv-pin-unlocked-1997";
var pinBuf="";
var gate=$("pinGate"),dots=$("pinDots").children,errEl=$("pinErr"),card=$("pinCard"),pinInp=$("pinInput");

function $(i){return document.getElementById(i)}
function showGate(){
 pinBuf="";pinInp.value="";errEl.textContent="";
 updateDots(false);
 gate.classList.remove("hidden");
 setTimeout(function(){try{pinInp.focus()}catch(e){}},50);
}
function hideGate(){
 gate.classList.add("hidden");
 fit();
}
function updateDots(isErr){
 $("pinDots").classList.toggle("err",!!isErr);
 for(var i=0;i<4;i++){
  dots[i].classList.toggle("on",i<pinBuf.length);
 }
}
function checkPin(){
 if(pinBuf===CORRECT_PIN){
  try{
   if($("pinRemember").checked)localStorage.setItem(PIN_KEY,"1");
   else sessionStorage.setItem(PIN_KEY,"1");
  }catch(e){}
  hideGate();
 }else{
  updateDots(true);
  errEl.textContent="Nieprawidłowy kod PIN";
  card.classList.remove("shake");
  void card.offsetWidth;
  card.classList.add("shake");
  setTimeout(function(){pinBuf="";pinInp.value="";updateDots(false)},450);
 }
}
function pushDigit(d){
 if(pinBuf.length>=4)return;
 errEl.textContent="";
 pinBuf+=d;
 pinInp.value=pinBuf;
 updateDots(false);
 if(pinBuf.length===4)setTimeout(checkPin,110);
}
$("pinPad").addEventListener("click",function(e){
 var b=e.target.closest("button[data-k]");
 if(!b)return;
 var k=b.getAttribute("data-k");
 if(k==="clr"){pinBuf="";pinInp.value="";errEl.textContent="";updateDots(false)}
 else if(k==="del"){pinBuf=pinBuf.slice(0,-1);pinInp.value=pinBuf;errEl.textContent="";updateDots(false)}
 else if(/^\d$/.test(k)){pushDigit(k)}
});
document.addEventListener("keydown",function(e){
 if(gate.classList.contains("hidden"))return;
 if(/^\d$/.test(e.key)){e.preventDefault();pushDigit(e.key)}
 else if(e.key==="Backspace"){e.preventDefault();pinBuf=pinBuf.slice(0,-1);updateDots(false)}
 else if(e.key==="Escape"){pinBuf="";updateDots(false)}
});
$("lockBtn").onclick=function(){
 try{localStorage.removeItem(PIN_KEY);sessionStorage.removeItem(PIN_KEY)}catch(e){}
 showGate();
};
(function initAuth(){
 var ok=false;
 try{ok=localStorage.getItem(PIN_KEY)==="1"||sessionStorage.getItem(PIN_KEY)==="1"}catch(e){}
 if(ok)gate.classList.add("hidden");
 else showGate();
})();

var ids=["data","wyrob","nrz","nrs","nabN","nabA","uzN","uzA","invN","invA","dU","dE","usterki","sposob","uwagi","miejsce","opis","zal","eN","eU","eI","sA","sB","sC"];
var KEY="hv-protokol-v3";
var HIST_KEY="hv-hist-v2";
var HIST_FIELDS=["sym","wyrob","nrz","nrs","nabN","nabA","uzN","uzA","invN","invA","usterki","sposob","uwagi","miejsce","opis","zal","sA","sB","sC"];
var PAIRS={nabN:"nabA",uzN:"uzA",invN:"invA"};
var DEFAULT_HIST={
 sym:["KW","KW/MN","MN"],
 wyrob:["PSD 2 E/L0","TSC 2.15","FZ"],
 nabN:[
  {v:"Przedsiębiorstwo Techniki Sanitarnej Eko-Ful",sub:"ul. Droga Łąkowa 16, 86-330"},
  {v:"HTI Sp. z o.o. Sp. k.",sub:"ul. Mikołaja 9, 62-080 Swadzim"}
 ],
 uzN:[
  {v:"Wspólnota Mieszkaniowa „Zacisze”",sub:"ul. Szwedzka 22-24, 76-200 Słupsk, NIP 8393252055"}
 ],
 usterki:[
  "Awaria PSD 2 E/L0. Oblepiony pływak 1 i 2. Gwarancja oddalona. Przyjazd serwisu płatny. Dok. fotograficzna wysłana do serwisu."
 ],
 sposob:[
  "Mechaniczne oczyszczenie pływaków. Próba ruchowa – zestaw sprawny."
 ],
 opis:[
  "Tłocznia została uruchomiona i sprawdzona. Ciśnienie pracy 4,5 bar. Urządzenie działa prawidłowo. Zamontowano przetwornik ciśnienia MELLER 6 bar / PCX 150.",
  "Montaż przepływomierza FM-300. Sprawdzono poprawność odczytania wskazań."
 ]
};
var HIST={};
var M={s:{c:1,y:"KW"},u:{c:1,y:"KW/MN"},m:{c:1,y:"MN"}};
var W=["zero","jeden","dwa","trzy","cztery","pięć","sześć","siedem","osiem","dziewięć","dziesięć"];
function g(i){return $(i).value}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fd(s){if(!s)return"";var p=s.split("-");return p[2]+"."+p[1]+"."+p[0]}
function nn(i){return parseInt(g(i),10)||0}
function words(n){n=parseInt(n,10)||0;return W[n]||String(n)}

/* Zapamiętywanie i wybór z listy */
function loadHist(){
 try{
  var raw=localStorage.getItem(HIST_KEY);
  HIST=raw?JSON.parse(raw):JSON.parse(JSON.stringify(DEFAULT_HIST));
 }catch(e){
  HIST=JSON.parse(JSON.stringify(DEFAULT_HIST));
 }
}
function saveHist(){
 try{localStorage.setItem(HIST_KEY,JSON.stringify(HIST))}catch(e){}
}
function rememberVal(id,val){
 if(HIST_FIELDS.indexOf(id)<0)return;
 var v=String(val||"").trim();
 if(!v)return;
 var list=HIST[id]||[];
 list=list.filter(function(item){
  var txt=typeof item==="string"?item:item.v;
  return txt!==v;
 });
 var entry=PAIRS[id]?{v:v,sub:g(PAIRS[id]).trim()}:v;
 list.unshift(entry);
 if(list.length>30)list.length=30;
 HIST[id]=list;
 saveHist();
 updateHistUI(id);
}
function rememberAll(){
 HIST_FIELDS.forEach(function(id){rememberVal(id,g(id))});
}
function updateHistUI(id){
 var list=HIST[id]||[];
 var btn=document.querySelector('.hist-btn[data-for="'+id+'"]');
 if(btn){
  btn.innerHTML='Lista <span class="cnt">('+list.length+')</span> ▾';
 }
 var dl=$("dl-"+id);
 if(dl){
  dl.innerHTML=list.map(function(it){
   var txt=typeof it==="string"?it:it.v;
   return '<option value="'+esc(txt)+'">';
  }).join("");
 }
}
function closeAllHist(){
 document.querySelectorAll(".hist-pop.open").forEach(function(p){p.classList.remove("open")});
}
function renderHistPop(id,filter){
 var pop=$("pop-"+id);
 if(!pop)return;
 var list=HIST[id]||[];
 var q=(filter||"").toLowerCase().trim();
 var filtered=list.map(function(it,idx){return{it:it,idx:idx}}).filter(function(row){
  if(!q)return true;
  var txt=typeof row.it==="string"?row.it:(row.it.v+" "+(row.it.sub||""));
  return txt.toLowerCase().indexOf(q)>=0;
 });
 var box=pop.querySelector(".hist-list");
 if(!filtered.length){
  box.innerHTML='<div class="hist-empty">'+(list.length?'Brak pasujących wpisów':'Brak zapisanych wpisów – wpisz tekst i zatwierdź')+'</div>';
  return;
 }
 box.innerHTML=filtered.map(function(row){
  var txt=typeof row.it==="string"?row.it:row.it.v;
  var sub=(typeof row.it==="object"&&row.it.sub)?row.it.sub:"";
  return '<div class="hist-item" data-idx="'+row.idx+'">'+
   '<div class="hist-txt" title="'+esc(txt)+'">'+esc(txt)+(sub?'<span class="hist-sub">'+esc(sub)+'</span>':'')+'</div>'+
   '<button type="button" class="hist-del" data-del="'+row.idx+'" title="Usuń z listy">×</button>'+
  '</div>';
 }).join("");
}
function initHistoryControls(){
 loadHist();
 HIST_FIELDS.forEach(function(id){
  var el=$(id);
  if(!el)return;
  var lbl=document.querySelector('label[for="'+id+'"]');
  var wrap=document.createElement("div");
  wrap.className="hist-wrap";
  el.parentNode.insertBefore(wrap,lbl||el);
  var row=document.createElement("div");
  row.className="lbl-row";
  if(lbl)row.appendChild(lbl);
  var btn=document.createElement("button");
  btn.type="button";
  btn.className="hist-btn";
  btn.setAttribute("data-for",id);
  row.appendChild(btn);
  wrap.appendChild(row);
  wrap.appendChild(el);
  if(el.tagName==="INPUT"){
   var dl=document.createElement("datalist");
   dl.id="dl-"+id;
   el.setAttribute("list",dl.id);
   wrap.appendChild(dl);
  }
  var pop=document.createElement("div");
  pop.className="hist-pop";
  pop.id="pop-"+id;
  pop.innerHTML='<div class="hist-head"><input type="search" placeholder="Szukaj na liście…" aria-label="Filtruj listę"><button type="button" class="hist-clr">Wyczyść</button></div><div class="hist-list"></div>';
  wrap.appendChild(pop);

  var searchInp=pop.querySelector("input");
  searchInp.addEventListener("input",function(){renderHistPop(id,searchInp.value)});
  pop.querySelector(".hist-clr").addEventListener("click",function(e){
   e.stopPropagation();
   HIST[id]=[];saveHist();updateHistUI(id);renderHistPop(id,"");
  });
  pop.querySelector(".hist-list").addEventListener("click",function(e){
   e.stopPropagation();
   var delBtn=e.target.closest("[data-del]");
   if(delBtn){
    var di=parseInt(delBtn.getAttribute("data-del"),10);
    HIST[id].splice(di,1);
    saveHist();updateHistUI(id);renderHistPop(id,searchInp.value);
    return;
   }
   var itemEl=e.target.closest(".hist-item");
   if(itemEl){
    var idx=parseInt(itemEl.getAttribute("data-idx"),10);
    var chosen=HIST[id][idx];
    if(chosen!==undefined){
     var val=typeof chosen==="string"?chosen:chosen.v;
     el.value=val;
     if(PAIRS[id]&&typeof chosen==="object"&&chosen.sub&&!g(PAIRS[id]).trim()){
      $(PAIRS[id]).value=chosen.sub;
     }
     if(id==="sym")M[T()].y=val;
     upd();
    }
    closeAllHist();
   }
  });
  btn.addEventListener("click",function(e){
   e.stopPropagation();
   var wasOpen=pop.classList.contains("open");
   closeAllHist();
   if(!wasOpen){
    searchInp.value="";
    renderHistPop(id,"");
    pop.classList.add("open");
    setTimeout(function(){try{searchInp.focus()}catch(err){}},30);
   }
  });
  el.addEventListener("blur",function(){
   rememberVal(id,el.value);
   if(id==="nabA"&&g("nabN").trim())rememberVal("nabN",g("nabN"));
   if(id==="uzA"&&g("uzN").trim())rememberVal("uzN",g("uzN"));
   if(id==="invA"&&g("invN").trim())rememberVal("invN",g("invN"));
  });
  updateHistUI(id);
 });
 document.addEventListener("click",function(e){
  if(!e.target.closest(".hist-wrap"))closeAllHist();
 });
}
function ln(l,v){return '<div class="ln"><b>'+l+'</b><span class="v">'+esc(v)+'</span></div>'}

function title(sub){return '<div class="t"><div class="n">PROTOKÓŁ Nr <span class="v" style="display:inline-block;min-width:130px;border:0">'+esc(numer())+'</span></div><div class="s">'+sub+'</div><div class="s">sporządzony w dniu <span class="v" style="display:inline-block;min-width:110px;border:0">'+fd(g("data"))+'</span> r.</div></div>'}
function dane(){
 return '<h3>DANE DOTYCZĄCE WYROBU</h3>'+
 sec(ln("Nazwa wyrobu:",g("wyrob"))+ln("Numer fabryczny zestawu:",g("nrz"))+ln("Numer seryjny układu sterowania:",g("nrs")))+
 sec('<b>1.&nbsp; Nabywca</b><div class="ind">'+ln("Nazwa:",g("nabN"))+ln("Adres:",g("nabA"))+'</div>')+
 sec('<b>2.&nbsp; Użytkownik</b><div class="ind">'+ln("Nazwa:",g("uzN"))+ln("Adres:",g("uzA"))+'</div>')+
 sec('<b>3.&nbsp; Inwestor</b><div class="ind">'+ln("Nazwa:",g("invN"))+ln("Adres:",g("invA"))+'</div>');
}
var photos=[];
function shrink(f){return new Promise(function(res){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.82))};im.onerror=function(){URL.revokeObjectURL(u);res(null)};im.src=u})}
function thumbs(){var t=$("thumbs");t.innerHTML="";photos.forEach(function(p,i){var d=document.createElement("div");d.className="th";var im=document.createElement("img");im.src=p;im.alt="Zdjęcie "+(i+1);var b=document.createElement("button");b.type="button";b.textContent="Usuń";b.setAttribute("aria-label","Usuń zdjęcie "+(i+1));b.onclick=function(){photos.splice(i,1);thumbs();render()};d.appendChild(im);d.appendChild(b);t.appendChild(d)})}
async function addFiles(fl){for(var i=0;i<fl.length;i++){var d=await shrink(fl[i]);if(d)photos.push(d)}thumbs();render()}
function render(){
 var t=T(),pg=[];
 $("nr").value=numer();
 if(t=="s"){
  var r=+R("rodzaj");
  var sub='z '+sx(r==0,"usuwania usterek")+' / '+sx(r==1,"naprawy zgłoszonej jako gwarancyjna")+' / '+sx(r==2,"wykonanego zlecenia")+' (niepotrzebne skreślić)';
  pg.push(head(false)+title(sub)+'<div class="box">'+dane()+
   sec(ln("4. Data stwierdzenia/zgłoszenia usterek:",fd(g("dU"))))+
   sec(ln("5. Data rozpoczęcia eksploatacji urządzenia:",fd(g("dE"))))+
   sec('<b>6.&nbsp; Wykaz stwierdzonych/zgłoszonych usterek:</b>'+rl(g("usterki"),5))+
   sec('<b>7.&nbsp; Sposób usunięcia usterek:</b>'+rl(g("sposob"),5)+'<div class="note">Wszystkie nieprawidłowości zostały skutecznie usunięte. W przypadku, gdy naprawy nie można było dokonać na miejscu, zostanie ona dokonana w jak najkrótszym uzasadnionym organizacyjnie i technicznie terminie.<br>'+cnts()+'</div>')+
   sec('<div class="sig2"><div class="l"><b>8.&nbsp; Protokół sporządzili:</b>'+ln("a)",g("sA"))+ln("b)",g("sB"))+'</div><div class="r">Podpis:</div></div>')+
   sec('<div class="sig"><div>9.&nbsp; Nabywca<small>(imię i nazwisko oraz podpis*)</small></div><div>10.&nbsp; Użytkownik<small>(imię i nazwisko oraz podpis*)</small></div><div>11.&nbsp; Inwestor<small>(imię i nazwisko oraz podpis*)</small></div></div>')+
   '</div><div class="fn">* w przypadku odmowy podpisu należy wskazać fakt odmowy w treści protokołu</div>');
 } else {
  var u=t=="u",tk=R("tak")=="TAK";
  pg.push(head(u)+title(u?"z uruchomienia":"z montażu")+'<div class="box">'+dane()+
   sec(ln(u?"4. Data zgłoszenia do uruchomienia:":"4. Data wykonania montażu:",fd(g("dU"))))+
   sec('<b>5.&nbsp; Czy dane w zgłoszeniu są zgodne ze stanem faktycznym? '+sx(tk,"TAK")+'/'+sx(!tk,"NIE")+' (niepotrzebne skreślić)</b><div style="margin-top:4px"><b>6.&nbsp; Uwagi do pkt. 5:</b></div>'+rl(g("uwagi"),5))+
   sec(ln("7. Miejsce instalacji:",g("miejsce")))+
   sec(u?'<b>8.&nbsp; Opis działania urządzenia:</b>'+rl(g("opis"),4):'<b>8.&nbsp; Opis urządzenia:</b><div style="margin:3px 0"><b>Urządzenie zostało zamontowane prawidłowo. Uruchomienie urządzenia nie było możliwe z następujących powodów:</b></div>'+rl(g("opis"),6))+
   sec('<b>9.&nbsp; Zalecenia:</b>'+rl(g("zal"),3))+'</div>');
  var cm=['11.&nbsp; Nabywca','12.&nbsp; Użytkownik','13.&nbsp; Inwestor'].map(function(x){return '<div><b>'+x+'</b><b style="margin-top:4px">Miejsce na zgłoszenie uwag:</b><div class="ruled" style="min-height:336px;margin-top:6px"></div><small>(imię i nazwisko oraz podpis*)</small></div>'}).join("");
  pg.push('<div class="box" style="margin-top:0"><h3>OSOBY UCZESTNICZĄCE</h3>'+
   sec('<div class="note" style="margin-top:0"><i>'+cnts()+' Wraz z protokołem przekazano Użytkownikowi niezbędne dokumenty dotyczące eksploatacji wyrobu.</i></div>')+
   sec('<div class="sig2"><div class="l"><b>10.&nbsp; Protokół sporządzili:</b>'+ln("a)",g("sA"))+ln("b)",g("sB"))+ln("c)",g("sC"))+'</div><div class="r">Podpis:</div></div>')+
   sec('<div class="sig3">'+cm+'</div>')+'</div><div class="fn">* w przypadku odmowy podpisu należy wskazać fakt odmowy (oraz przyczynę, jeśli jest znana) w treści protokołu</div>');
 }
 for(var k=0;k<photos.length;k+=4){pg.push(head(false)+'<div class="t"><div class="n">ZAŁĄCZNIK DO PROTOKOŁU Nr '+esc(numer())+'</div><div class="s">Dokumentacja fotograficzna</div></div><div class="ph">'+photos.slice(k,k+4).map(function(p){return '<div><img src="'+p+'" alt=""></div>'}).join("")+'</div>')}
 $("sheet").innerHTML=pg.map(function(p){return '<div class="pg">'+p+'</div>'}).join("");
 fit();
}

 sh.style.transform="scale("+s+")";

 document.querySelectorAll("[data-t]").forEach(function(e){e.style.display=e.getAttribute("data-t").indexOf(t)>=0?"":"none"});
 $("lbDU").textContent={s:"Data stwierdzenia/zgłoszenia usterek",u:"Data zgłoszenia do uruchomienia",m:"Data wykonania montażu"}[t];

function save(){
 try{var o={M:M,typ:T(),rodzaj:R("rodzaj"),tak:R("tak")};ids.forEach(function(i){o[i]=g(i)});localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
}

});

function busy(b){var e=$("print");e.disabled=b;e.textContent=b?"Generuję PDF…":"Drukuj / zapisz PDF"}
async function makePdf(){
 rememberAll();
 var sh=$("sheet"),wr=$("wrap"),tr=sh.style.transform,h=wr.style.height,ov=wr.style.overflow;
 busy(true);
 try{
  sh.transform="none";sh.style.transform="none";wr.style.height="auto";wr.style.overflow="visible";
  var pages=sh.querySelectorAll(".pg"),doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  for(var i=0;i<pages.length;i++){
   var c=await html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",useCORS:true});
   if(i)doc.addPage();
   doc.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
  }
  var name="Protokol_"+numer().replace(/\//g,"-")+".pdf";
  var d=null;
  try{if(window.claude&&window.claude.use)d=await window.claude.use("downloads")}catch(e){}
  if(d){await d.save({filename:name,data:doc.output("blob")})}
  else{var blob=doc.output("blob"),f=new File([blob],name,{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name})}else{doc.save(name)}}
 }catch(e){
  if(!e||e.code!=="declined")alert("Nie udało się zapisać PDF"+(e&&e.message?": "+e.message:""));
 }finally{
  sh.style.transform=tr;wr.style.height=h;wr.style.overflow=ov;busy(false);fit();
 }
}
$("print").onclick=makePdf;
$("camBtn").onclick=function(){$("cam").click()};
$("galBtn").onclick=function(){$("gal").click()};
["cam","gal"].forEach(function(i){$(i).addEventListener("change",function(e){var f=Array.prototype.slice.call(e.target.files);e.target.value="";addFiles(f)})});
var CL=["nrz","nrs","dE","usterki","sposob","uwagi","miejsce","opis","zal"];
$("nowy").onclick=function(){rememberAll();var t=T();M[t].c++;$("cnt").value=M[t].c;CL.forEach(function(i){$(i).value=""});syncDates(true);photos=[];thumbs();setR("tak","TAK");upd();window.scrollTo(0,0)};
$("clear").onclick=function(){if(!confirm("Wyczyścić wszystkie pola?"))return;ids.forEach(function(i){$(i).value=""});CL.forEach(function(i){$(i).value=""});$("eN").value=1;$("eU").value=1;$("eI").value=0;syncDates(true);photos=[];thumbs();setR("tak","TAK");upd()};
window.addEventListener("resize",fit);
window.addEventListener("beforeprint",function(){$("sheet").style.transform="none"});
window.addEventListener("afterprint",fit);
render();
})();
</script>
